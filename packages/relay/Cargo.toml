[package]
name = "whalemaid-relay"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "WhaleMaid 中继控制面：设备注册/授权/吊销 + rathole sidecar 管理（SPEC: docs/protocol.md）"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
scrypt = "0.11"
getrandom = "0.2"
# rathole 同款 noise（snowstorm 0.4，与 rathole 依赖一致）：静态 X25519 密钥对生成
snowstorm = { version = "0.4", default-features = false }
base64 = "0.22"
# 由持久化 private 推导 public（snow 的 generate_keypair 总生成新密钥，不能用于恢复）
x25519-dalek = { version = "2", features = ["static_secrets"] }
# SEC-004b 隧道入口 TLS（与 axum-server 同 rustls 0.23 体系）
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
futures-util = "0.3"
