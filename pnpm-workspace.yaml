packages:
  - packages/contract
  - packages/plugin
  - packages/hotwords
  - packages/control
  - packages/mobile

allowBuilds:
  esbuild: set this to true or false

# esbuild 的 postinstall 仅为兜底下载；二进制由 @esbuild/<platform> 平台包提供，显式忽略以通过 pnpm 严格构建检查
ignoredBuiltDependencies:
  - esbuild

verifyDepsBeforeRun: false
