<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111317">
  <title>WhaleMaid</title>
  <style>
    :root{color-scheme:dark;--bg:#111317;--surface:#191c21;--surface-2:#20242a;--line:#30353d;--text:#f1f3f5;--muted:#9aa2ad;--faint:#68717d;--blue:#5c8dff;--green:#41c982;--red:#ff7272;--amber:#e8b75d;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box;letter-spacing:0}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    body{min-height:100vh;min-height:100dvh}
    button,input{font:inherit}
    button{color:inherit}
    button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    .app{width:100%;min-height:100vh;min-height:100dvh;padding:calc(var(--safe-top) + 12px) 18px calc(var(--safe-bottom) + 20px)}
    .shell{width:100%;max-width:620px;margin:0 auto}
    .topbar{height:48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:680}
    .mark{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--text);color:#15171a;font-size:11px;font-weight:800}
    .icon-btn,.text-btn{border:0;background:transparent;min-height:40px;padding:0 8px;border-radius:6px;color:var(--muted);cursor:pointer}
    .icon-btn{font-size:24px;line-height:1}.icon-btn:hover,.text-btn:hover{background:var(--surface-2);color:var(--text)}
    .view{display:none}.view.active{display:block}
    .heading{padding:28px 0 18px}.heading h1{margin:0;font-size:24px;line-height:1.25}.heading p{margin:7px 0 0;color:var(--muted);font-size:14px}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}.section-head h2{font-size:13px;color:var(--muted);font-weight:620;margin:0;text-transform:uppercase}
    .device-list{border-top:1px solid var(--line)}
    .device-row{min-height:76px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 44px;align-items:center;gap:8px}
    .device-main{height:100%;border:0;background:transparent;text-align:left;padding:14px 4px;cursor:pointer;min-width:0}
    .device-main:active{background:var(--surface)}
    .device-title{font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .device-meta{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--muted);font-size:13px}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 auto}.dot.online{background:var(--green)}.dot.offline{background:var(--red)}.dot.checking{background:var(--amber)}
    .remove{border:0;background:transparent;width:40px;height:40px;border-radius:6px;color:var(--faint);font-size:20px;cursor:pointer}.remove:hover{background:var(--surface-2);color:var(--red)}
    .empty{padding:54px 0;text-align:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.empty strong{display:block;font-size:16px}.empty span{display:block;color:var(--muted);font-size:13px;margin-top:6px}
    .primary,.secondary,.danger{width:100%;min-height:48px;border-radius:7px;padding:0 16px;font-weight:650;cursor:pointer}
    .primary{border:0;background:var(--blue);color:#fff}.primary:hover{background:#709cff}.primary:disabled{opacity:.45;cursor:default}
    .secondary{border:1px solid var(--line);background:var(--surface);color:var(--text)}.secondary:hover{background:var(--surface-2)}
    .danger{border:1px solid #6b3438;background:transparent;color:var(--red)}
    .add{margin-top:18px}
    .form{padding-top:8px}.field{margin:18px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}.field input{width:100%;height:48px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);padding:0 13px;font-size:16px}.field input::placeholder{color:var(--faint)}
    .segmented{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:7px;padding:3px;background:var(--surface)}.segmented label{margin:0;cursor:pointer}.segmented input{position:absolute;opacity:0;pointer-events:none}.segmented span{display:grid;place-items:center;height:38px;border-radius:5px;color:var(--muted);font-size:14px}.segmented input:checked+span{background:#343943;color:var(--text)}.segmented input:focus-visible+span{outline:2px solid var(--blue)}
    .check{display:flex;align-items:flex-start;gap:10px;color:var(--muted);font-size:13px;margin:16px 0}.check input{width:18px;height:18px;margin:0;accent-color:var(--blue)}
    .status{min-height:22px;margin:13px 0 0;font-size:13px;color:var(--muted)}.status.error{color:var(--red)}.status.ok{color:var(--green)}
    .connection-state{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px}.lock{color:var(--green);font-size:14px}
    .server-current{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.server-current code{color:var(--muted);font-size:13px;overflow-wrap:anywhere}.server-current span{color:var(--green);font-size:13px;white-space:nowrap}
    .overlay{position:fixed;inset:0;display:none;place-items:center;background:rgba(9,10,12,.78);z-index:10;padding:24px}.overlay.active{display:grid}.progress{width:min(100%,320px);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px;text-align:center}.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite}.progress strong{display:block}.progress span{display:block;color:var(--muted);font-size:13px;margin-top:7px}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (min-width:720px){.app{padding-left:28px;padding-right:28px}.heading{padding-top:38px}}
  </style>
</head>
<body>
  <main class="app"><div class="shell">
    <header class="topbar">
      <div class="brand"><span class="mark" aria-hidden="true">WM</span><span>WhaleMaid</span></div>
      <button id="settings" class="text-btn" type="button">设置</button>
    </header>

    <section id="server-view" class="view" aria-labelledby="server-title">
      <div class="heading"><h1 id="server-title">连接服务</h1><p>WhaleMaid 中继</p></div>
      <form id="server-form" class="form">
        <div class="field"><label for="server">服务器地址</label><input id="server" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="relay.example.com"></div>
        <button id="save-server" class="primary" type="submit">保存并检查</button>
        <button id="server-back" class="secondary add" type="button" hidden>返回设备</button>
        <div id="server-status" class="status" role="status"></div>
      </form>
    </section>

    <section id="home-view" class="view" aria-labelledby="home-title">
      <div class="heading"><h1 id="home-title">我的设备</h1><p class="connection-state"><span class="lock">●</span><span>连接已加密</span></p></div>
      <div class="section-head"><h2>设备</h2><button id="refresh" class="text-btn" type="button">刷新</button></div>
      <div id="device-list" class="device-list"></div>
      <div id="empty" class="empty"><strong>还没有设备</strong><span>添加一台受控设备</span></div>
      <button id="add-device" class="primary add" type="button">添加设备</button>
    </section>

    <section id="connect-view" class="view" aria-labelledby="connect-title">
      <div class="heading"><button id="connect-back" class="icon-btn" type="button" aria-label="返回">‹</button><h1 id="connect-title">添加设备</h1><p id="device-state">等待设备编号</p></div>
      <form id="connect-form" class="form">
        <div class="field"><label>连接方式</label><div class="segmented" role="radiogroup" aria-label="连接方式">
          <label><input type="radio" name="kind" value="longTerm" checked><span>长期连接</span></label>
          <label><input type="radio" name="kind" value="temporary"><span>临时协助</span></label>
        </div></div>
        <div class="field"><label for="device">设备编号</label><input id="device" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="WHALE-XXXX-XXXX"></div>
        <div class="field"><label for="password">设备密码</label><input id="password" type="password" autocomplete="off" placeholder="长期密码"></div>
        <label id="remember-row" class="check"><input id="remember" type="checkbox" checked><span>在此设备安全保存长期授权</span></label>
        <button id="connect" class="primary" type="submit">连接</button>
        <div id="connect-status" class="status" role="status"></div>
      </form>
    </section>

    <section id="settings-view" class="view" aria-labelledby="settings-title">
      <div class="heading"><button id="settings-back" class="icon-btn" type="button" aria-label="返回">‹</button><h1 id="settings-title">设置</h1><p>连接服务</p></div>
      <div class="server-current"><code id="current-server"></code><span>已固定证书</span></div>
      <button id="change-server" class="secondary add" type="button">更换服务器</button>
    </section>
  </div></main>

  <div id="overlay" class="overlay" role="status" aria-live="polite"><div class="progress"><div class="spinner"></div><strong id="progress-title">正在连接</strong><span id="progress-detail">验证设备并建立安全通道</span></div></div>

  <script>
    const byId = id => document.getElementById(id)
    const controllerToken = '__WHALEMAID_LOCAL_TOKEN__'
    const errors = {
      DEVICE_NOT_FOUND:'设备编号不存在',DEVICE_OFFLINE:'设备当前离线',INVALID_CREDENTIAL:'密码错误',
      CREDENTIAL_EXPIRED:'临时密码已过期',CREDENTIAL_CONSUMED:'临时密码已使用',CREDENTIAL_REVOKED:'临时密码已撤销',
      CREDENTIAL_SUPERSEDED:'临时密码已刷新',RATE_LIMITED:'尝试过多，请稍后再试',LOCKED:'密码已暂时锁定',
      INVALID_SESSION:'连接授权已失效',SAVED_CREDENTIAL_NOT_FOUND:'已保存授权失效，请重新输入密码',
      RELAY_UNREACHABLE:'无法连接服务器',SECURE_STORAGE_UNAVAILABLE:'无法使用系统安全存储',INVALID_RELAY_RESPONSE:'服务器响应无效',
      INVALID_SERVER:'服务器地址无效',SERVER_REQUIRED:'请输入服务器地址'
    }
    let snapshot = {configured:false,server:'',devices:[]}
    let currentView = ''
    let statusTimer = 0
    let statusRefreshInFlight = null

    async function api(path, options = {}) {
      const response = await fetch(path, {headers:{'content-type':'application/json','x-whalemaid-controller':controllerToken},...options})
      let data = {}
      try { data = await response.json() } catch (_) {}
      if (!response.ok) {
        const error = new Error(errors[data.error] || data.error || `请求失败 (${response.status})`)
        error.code = data.error
        throw error
      }
      return data
    }

    function show(view) {
      currentView = view
      for (const node of document.querySelectorAll('.view')) node.classList.toggle('active', node.id === `${view}-view`)
      byId('settings').style.visibility = view === 'home' ? 'visible' : 'hidden'
      clearInterval(statusTimer)
      if (view === 'home') statusTimer = setInterval(refreshStatuses, 6000)
    }

    function setStatus(id, message, kind = '') {
      const node = byId(id)
      node.textContent = message
      node.className = `status ${kind}`
    }

    function setBusy(active, title = '正在连接', detail = '验证设备并建立安全通道') {
      byId('progress-title').textContent = title
      byId('progress-detail').textContent = detail
      byId('overlay').classList.toggle('active', active)
    }

    async function loadSnapshot() {
      snapshot = await api('/_ctrl/state')
      byId('server').value = snapshot.server || ''
      byId('current-server').textContent = snapshot.server || '未配置'
      renderDevices()
      show(snapshot.configured ? 'home' : 'server')
      if (snapshot.configured) void refreshStatuses()
    }

    function renderDevices() {
      const list = byId('device-list')
      list.replaceChildren()
      byId('empty').hidden = snapshot.devices.length > 0
      for (const device of snapshot.devices) {
        const row = document.createElement('div')
        row.className = 'device-row'
        row.dataset.device = device.deviceId
        const main = document.createElement('button')
        main.className = 'device-main'
        main.type = 'button'
        const title = document.createElement('div')
        title.className = 'device-title'
        title.textContent = device.deviceId
        const meta = document.createElement('div')
        meta.className = 'device-meta'
        const dot = document.createElement('span')
        dot.className = 'dot checking'
        const label = document.createElement('span')
        label.textContent = '检查状态'
        meta.append(dot, label)
        main.append(title, meta)
        main.addEventListener('click', () => connectSaved(device.deviceId))
        const remove = document.createElement('button')
        remove.className = 'remove'
        remove.type = 'button'
        remove.setAttribute('aria-label', `移除 ${device.deviceId}`)
        remove.textContent = '×'
        remove.addEventListener('click', () => removeDevice(device.deviceId))
        row.append(main, remove)
        list.append(row)
      }
    }

    async function refreshStatuses() {
      if (currentView !== 'home') return
      if (statusRefreshInFlight) return statusRefreshInFlight
      statusRefreshInFlight = Promise.all(snapshot.devices.map(async device => {
        const row = document.querySelector(`[data-device="${CSS.escape(device.deviceId)}"]`)
        if (!row) return
        const dot = row.querySelector('.dot')
        const label = row.querySelector('.device-meta span:last-child')
        dot.className = 'dot checking'; label.textContent = '检查状态'
        try {
          const status = await api('/_ctrl/status',{method:'POST',body:JSON.stringify({server:device.server,deviceId:device.deviceId})})
          dot.className = `dot ${status.online ? 'online' : 'offline'}`
          label.textContent = status.online ? '在线' : status.registered ? '离线' : '设备不存在'
        } catch (_) { dot.className = 'dot'; label.textContent = '状态未知' }
      })).finally(() => { statusRefreshInFlight = null })
      return statusRefreshInFlight
    }

    async function connectSaved(deviceId) {
      setBusy(true, '正在连接', deviceId)
      try {
        await api('/_ctrl/connect-saved',{method:'POST',body:JSON.stringify({deviceId})})
        location.replace('/')
      } catch (error) {
        setBusy(false)
        if (error.code === 'SAVED_CREDENTIAL_NOT_FOUND') {
          snapshot.devices = snapshot.devices.filter(device => device.deviceId !== deviceId)
          renderDevices()
          openConnect(deviceId)
          setStatus('connect-status', error.message, 'error')
        } else alert(error.message)
      }
    }

    function openConnect(deviceId = '') {
      byId('device').value = deviceId
      byId('password').value = ''
      setStatus('connect-status','')
      byId('device-state').textContent = deviceId ? '重新验证长期密码' : '等待设备编号'
      show('connect')
      if (deviceId) void lookupDevice()
    }

    async function lookupDevice() {
      const deviceId = byId('device').value.trim().toUpperCase()
      if (!deviceId) { byId('device-state').textContent = '等待设备编号'; return }
      byId('device-state').textContent = '正在检查'
      try {
        const status = await api('/_ctrl/status',{method:'POST',body:JSON.stringify({deviceId})})
        byId('device-state').textContent = status.online ? '设备在线' : status.registered ? '设备离线' : '设备不存在'
      } catch (_) { byId('device-state').textContent = '状态未知' }
    }

    async function removeDevice(deviceId) {
      if (!confirm(`移除 ${deviceId}？`)) return
      await api('/_ctrl/device',{method:'DELETE',body:JSON.stringify({deviceId})})
      snapshot.devices = snapshot.devices.filter(device => device.deviceId !== deviceId)
      renderDevices()
    }

    byId('server-form').addEventListener('submit', async event => {
      event.preventDefault(); setStatus('server-status','正在检查服务器')
      byId('save-server').disabled = true
      try {
        await api('/_ctrl/configure',{method:'POST',body:JSON.stringify({server:byId('server').value.trim()})})
        snapshot = await api('/_ctrl/state'); renderDevices(); show('home'); void refreshStatuses()
      } catch (error) { setStatus('server-status',error.message,'error') }
      finally { byId('save-server').disabled = false }
    })

    byId('connect-form').addEventListener('submit', async event => {
      event.preventDefault()
      const kind = document.querySelector('input[name="kind"]:checked').value
      const deviceId = byId('device').value.trim().toUpperCase()
      setBusy(true, kind === 'temporary' ? '正在建立临时连接' : '正在连接', deviceId)
      try {
        await api('/_ctrl/connect',{method:'POST',body:JSON.stringify({
          deviceId,password:byId('password').value,credentialKind:kind,
          remember:kind === 'longTerm' && byId('remember').checked
        })})
        byId('password').value = ''
        location.replace('/')
      } catch (error) { setBusy(false); setStatus('connect-status',error.message,'error') }
    })

    for (const radio of document.querySelectorAll('input[name="kind"]')) radio.addEventListener('change', () => {
      const temporary = radio.checked && radio.value === 'temporary'
      if (!radio.checked) return
      byId('password').placeholder = temporary ? '临时密码' : '长期密码'
      byId('remember-row').hidden = temporary
    })
    byId('device').addEventListener('input', () => { clearTimeout(byId('device')._timer); byId('device')._timer = setTimeout(lookupDevice,450) })
    byId('settings').addEventListener('click', () => show('settings'))
    byId('settings-back').addEventListener('click', () => show('home'))
    byId('change-server').addEventListener('click', () => { byId('server-back').hidden = false; show('server') })
    byId('server-back').addEventListener('click', () => show('settings'))
    byId('connect-back').addEventListener('click', () => show('home'))
    byId('add-device').addEventListener('click', () => openConnect())
    byId('refresh').addEventListener('click', refreshStatuses)

    loadSnapshot().catch(error => { show('server'); setStatus('server-status',error.message,'error') })
  </script>
</body>
</html>
